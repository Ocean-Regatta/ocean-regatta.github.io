site_name: Ocean Regatta
site_url: https://ocean-regatta.github.io/
site_description: Official documentation and competition portal for the Ocean Regatta autonomous marine robotics challenge.
site_author: Ocean Regatta Organizing Committee
repo_name: ocean-regatta/ocean-regatta.github.io
repo_url: https://github.com/ocean-regatta/ocean-regatta.github.io
edit_uri: edit/master/docs/
copyright: "Copyright &copy; 2026 Ocean Regatta &middot; Released under MIT License"

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - search.share
  palette:
    # Light mode (Ocean Blue)
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode (Deep Abyss)
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    logo: material/sail-boat
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.keys
  - pymdownx.mark
  - tables
  - attr_list
  - def_list

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Competitor Guide:
      - Quick Start: quickstart.md
      - Hardware Driver & Sensors: driver_api.md
      - 3D Playback (Gazebo Replay): replay.md
  - Challenge Editions:
      - 2026 Edition (Active): editions/2026.md
  - Live Scoreboard:
      - 2026 Edition (Active): scoreboards/2026.md
  - Deployment & Organizers: maintenance_deploy.md
